<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<link rel="icon" href="data:,">
<title>Luyện tập | YooBook</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<script type="importmap">{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}</script>
<style>
:root{
  --brand:#195856; --brand-dark:#0f3f3d; --brand-light:#2f827d; --brand-soft:#e6f0ee;
  --ink:#10302d; --muted:#5f8b89; --line:#dbe8e5; --stage-mid:#f1f9f7; --stage-bottom:#dcebe7;
  --ok:#6fa85b; --bad:#c96a4f; --gold:#ffcf5a; --red:#d6382f;
  --r:16px; --r-sm:11px;
  --sh-1:0 1px 2px rgba(13,42,40,.05);
  --sh-2:0 2px 6px rgba(13,42,40,.06),0 18px 34px -22px rgba(13,42,40,.45);
  --sh-3:0 10px 30px -12px rgba(13,42,40,.32);
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font-family:'Roboto',system-ui,-apple-system,'Segoe UI',sans-serif;font-size:15px;line-height:1.5;color:var(--ink);background:#195658;overflow:hidden;overscroll-behavior:none;-webkit-tap-highlight-color:transparent}
button{font-family:inherit}
.app{height:100dvh;display:flex;flex-direction:column;overflow:hidden}
.topbar{display:flex;align-items:center;gap:12px;padding:10px 16px;background:#fff;border-bottom:1px solid var(--line);box-shadow:var(--sh-1);z-index:20;flex:0 0 auto}
.logoclip{height:27px;display:flex;align-items:center;flex:0 0 auto}
.logo{height:27px;display:block}
.titles{flex:1;min-width:0}
.badge{display:inline-block;max-width:100%;font-size:11px;font-weight:600;letter-spacing:.02em;color:var(--brand);background:var(--brand-soft);border-radius:99px;padding:2px 9px;margin-bottom:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;vertical-align:top}
.titles h1{margin:0;font-weight:700;font-size:18px;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tb-btn{width:38px;height:38px;border-radius:11px;border:1px solid var(--line);background:#fff;display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--brand-dark)}
.tb-btn:hover{background:var(--brand-soft);border-color:var(--brand-light)}
.main{flex:1;min-height:0;display:flex;flex-direction:column;padding:14px;overflow:hidden}
.frame{background:#fff;border-radius:var(--r);box-shadow:var(--sh-2);display:flex;flex-direction:column;flex:1;min-height:0;overflow:hidden}
.stage{position:relative;flex:1;min-height:0;background:radial-gradient(75% 80% at 32% 45%,#23706d 0%,#195658 55%,#123f3e 100%);overflow:hidden}
.vignette{position:absolute;inset:0;z-index:1;pointer-events:none;box-shadow:inset 0 0 90px rgba(15,63,61,.10)}
.stage-tools{position:absolute;left:62px;top:12px;z-index:6;display:flex;gap:8px;flex-wrap:wrap}
.ghost{background:rgba(255,255,255,.90);backdrop-filter:blur(8px) saturate(1.3);border:1px solid var(--line);border-radius:var(--r-sm);padding:7px 11px;font-size:12.5px;font-weight:500;color:var(--brand-dark);cursor:pointer;display:flex;align-items:center;gap:6px;box-shadow:var(--sh-1)}
.ghost[aria-pressed="true"]{background:var(--brand);color:#fff;border-color:var(--brand)}
.stage-nav{position:absolute;top:50%;z-index:30;transform:translateY(-50%);width:38px;height:38px;border-radius:99px;border:1px solid var(--line);background:rgba(255,255,255,.88);backdrop-filter:blur(8px);display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--brand-dark);box-shadow:var(--sh-1);font-size:16px}
.stage-nav.prev{left:12px}.stage-nav.next{right:12px}
.stage-nav[disabled]{opacity:.3;pointer-events:none}
.stage-nav.nudge{animation:nudgePulse 1.2s ease infinite}
@keyframes nudgePulse{0%,100%{box-shadow:0 0 0 0 rgba(255,207,90,.8)}50%{box-shadow:0 0 0 10px rgba(255,207,90,0)}}

/* vùng 3D (bên trái) + bảng bài học (bên phải) */
.view{position:absolute;z-index:2;left:0;top:0;bottom:0;right:calc(min(500px,44%) + 60px);touch-action:none;cursor:grab}
.view:active{cursor:grabbing}
.view canvas{display:block;width:100%!important;height:100%!important}
.lesson{position:absolute;z-index:7;right:60px;top:12px;bottom:12px;width:min(500px,44%);display:flex;flex-direction:column;background:rgba(255,255,255,.95);backdrop-filter:blur(12px);border-radius:var(--r);box-shadow:var(--sh-3);overflow:hidden}
.sidebody{flex:1;min-height:0;overflow:auto;padding:18px 20px 16px;background:linear-gradient(#fff,var(--stage-mid) 70%,var(--stage-bottom))}
.sec{animation:fade .3s ease}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.chip{display:inline-block;font-size:12px;font-weight:700;color:var(--brand);background:var(--brand-soft);border-radius:99px;padding:3px 11px;margin-bottom:6px}
.sec h2{margin:0 0 10px;font-size:22px;line-height:1.3;color:var(--brand-dark)}
.card{background:#fff;border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh-1);padding:14px 16px;margin:12px 0}
.card p{font-size:16px;line-height:1.6;margin:0}
.card p+p{margin-top:8px}
.kcard{border-radius:var(--r-sm);padding:12px 14px;margin-top:12px;border:1.5px solid var(--brand-light);background:#fff;box-shadow:var(--sh-1);animation:fade .35s ease}
.kcard .kh{display:inline-flex;align-items:center;gap:7px;font-size:12px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:#fff;background:var(--brand);border-radius:99px;padding:4px 12px 4px 9px;margin-bottom:8px}
.kcard .kh::before{content:'';width:8px;height:8px;border-radius:50%;background:#fff}
.kcard p,.kcard li{margin:0;font-size:16px;line-height:1.6}
.kcard ul{margin:0;padding-left:20px}
.kcard li+li{margin-top:4px}
.red{color:var(--red);font-weight:700}
.kwd{font-weight:700;color:var(--brand-light)}
.nar{display:flex;gap:10px;align-items:flex-start;background:#fff;border:1px solid var(--line);border-left:4px solid var(--brand-light);border-radius:var(--r-sm);padding:10px 12px;margin:0 0 12px;box-shadow:var(--sh-1)}
.nar .av{flex:0 0 30px;height:30px;border-radius:50%;background:var(--brand);color:#fff;font-weight:700;font-size:12px;display:flex;align-items:center;justify-content:center}
.nar .tx{font-size:16px;line-height:1.6}
.opts{display:flex;flex-direction:column;gap:8px;margin:10px 0 0}
.opt{display:flex;gap:10px;align-items:flex-start;width:100%;text-align:left;padding:11px 13px;border-radius:var(--r-sm);border:1.5px solid var(--line);background:#fff;color:var(--ink);font-size:16px;cursor:pointer}
.opt i{font-style:normal;flex:0 0 24px;height:24px;border-radius:50%;background:var(--brand-soft);color:var(--brand);font-weight:700;font-size:12.5px;display:flex;align-items:center;justify-content:center}
.opt:hover:not(:disabled){border-color:var(--brand-light);background:var(--stage-mid)}
.opt:disabled{cursor:default}
.opt.ok{border-color:var(--brand);background:var(--brand-soft);color:var(--brand-dark);font-weight:600}
.opt.ok i{background:var(--brand);color:#fff}
.opt.no{border-color:var(--bad);background:#fbeae4;color:#a54527}
.opt.no i{background:var(--bad);color:#fff}
.fb{display:none;margin:10px 0 0;padding:10px 13px;border-radius:var(--r-sm);font-size:15.5px;line-height:1.6}
.fb.show{display:block;animation:fade .25s ease}
.fb.ok{background:var(--brand-soft);color:var(--brand-dark)}
.fb.no{background:#fbeae4;color:#a54527}
.fb.infobtn{background:#fff6dd;color:#6b4d13}
.qbtn{border:0;border-radius:11px;padding:11px 20px;font-size:15.5px;font-weight:600;cursor:pointer;background:var(--brand);color:#fff;margin:10px 8px 0 0}
.qbtn:hover:not(:disabled){background:var(--brand-dark)}
.qbtn:disabled{opacity:.45;cursor:not-allowed}
.next-wrap{margin:16px 0 4px;display:flex;justify-content:flex-end}
.next-btn{margin:0;padding:12px 22px;animation:nudgePulse 1.4s ease .5s infinite}
.hint{font-size:13.5px;color:var(--muted);margin:8px 0 0}
/* tab con HĐ1–HĐ3 */
.subtabs{display:flex;gap:8px;margin:0 0 14px}
.subtab{flex:1 1 0;min-width:0;display:flex;align-items:center;justify-content:center;gap:6px;padding:9px 6px;border:1.5px solid var(--line);border-bottom-width:3px;border-radius:11px;background:#fff;color:var(--brand-dark);font-size:13.5px;font-weight:600;cursor:pointer;white-space:nowrap;box-shadow:var(--sh-1);transition:background .15s,border-color .15s,transform .1s}
.subtab:hover:not(.on){border-color:var(--brand-light);background:var(--stage-mid);transform:translateY(-1px)}
.subtab:active{transform:translateY(1px)}
.subtab.lt{font-size:19px;font-weight:800;color:#2a9fe0;padding:6px 4px}
.subtab.lt.on{color:#fff}
.tiles.gal{grid-template-columns:repeat(5,1fr)}
.tile.cap{aspect-ratio:auto;flex-direction:column;gap:4px;padding:8px 4px 6px}
.tile.cap img{width:100%;height:auto;aspect-ratio:1}
.tile .cp{font-size:11.5px;font-weight:600;line-height:1.25;color:var(--brand-dark);text-align:center}
.tile.view{box-shadow:0 0 0 3px var(--gold)}
.tile .iw{position:relative;display:block;width:100%}
.tile .iw img{display:block;width:100%;height:auto;aspect-ratio:1;object-fit:contain}
.tile.showax .iw::after{content:'';position:absolute;left:50%;top:2%;bottom:2%;margin-left:-1.5px;border-left:3px dashed #e9a800}
/* bước gallery: chiếm toàn bộ khung */
.stage.full .view,.stage.full .dock,.stage.full .verdict,.stage.full .stage-hint,.stage.full .stage-tools{display:none!important}
.stage.full .lesson{left:60px;right:60px;width:auto}
.stage.full .lesson{background:transparent;box-shadow:none;backdrop-filter:none} /* bỏ khung trắng ngoài cùng */
.stage.full .sidebody{background:transparent;padding-top:6px}
.stage.full .sec>h2{color:#fff;text-shadow:0 1px 4px rgba(0,0,0,.25)}
.stage.full .sec>.card:first-of-type{margin-top:6px}
.stage.full .tiles.gal{grid-template-columns:repeat(5,1fr);gap:14px}
.stage.full .tile.cap{padding:12px 10px 10px;gap:8px}
/* gallery giãn hết chiều cao khung: 2 hàng thẻ chia đều phần trống */
.stage.full .sidebody{display:flex;flex-direction:column}
.stage.full .sec{flex:1 0 auto;display:flex;flex-direction:column}
.stage.full .sec>.card:first-of-type{flex:1 0 auto;display:flex;flex-direction:column;min-height:400px;margin-bottom:0}
.stage.full .tiles.gal{flex:1;grid-template-rows:repeat(2,minmax(0,1fr))}
.stage.full .sec>.card:first-of-type>.qbtn{align-self:flex-start}
.stage.full .tile.cap{justify-content:center;min-height:0}
.stage.full .tile .iw{flex:1;min-height:0;width:100%;display:flex;align-items:center;justify-content:center}
.stage.full .tile .iw img{width:auto;height:100%;max-width:100%;aspect-ratio:1}
.stage.full .tile .cp{font-size:18px;font-weight:700}
.stage.full .sec>h2{font-size:26px}
.stage.full .card p{font-size:18px}
.stage.full .card .hint{font-size:16px}
.tile.sel.view{box-shadow:0 0 0 3px var(--gold),0 0 0 6px rgba(25,88,86,.15)}
.subtab.sg{padding:5px 6px}
.subtab.sg img{width:38px;height:38px;flex:0 0 38px}
.subtab.sg span{font-size:14px}
.subtab span{overflow:hidden;text-overflow:ellipsis}
.subtab b{flex:0 0 20px;height:20px;border-radius:50%;background:var(--brand-soft);color:var(--brand);font-size:11px;display:flex;align-items:center;justify-content:center}
.subtab.on{background:var(--brand);border-color:var(--brand-dark);color:#fff;box-shadow:0 4px 10px -4px rgba(15,63,61,.5)}
.subtab.on b{background:rgba(255,255,255,.25);color:#fff}
.subtab.done:not(.on) b{background:var(--brand);color:#fff}
.subtab.locked{opacity:.45;cursor:not-allowed}
/* ô chọn (chữ cái / biển báo) */
.tiles{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;margin-top:10px}
.tiles.t4{grid-template-columns:repeat(4,1fr)}
.tile{position:relative;aspect-ratio:1;border-radius:12px;border:2px solid var(--line);background:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center;padding:4px}
.tile img{width:100%;height:100%;object-fit:contain;pointer-events:none}
.tile .tl{position:absolute;left:4px;bottom:2px;font-size:11px;font-weight:700;color:var(--muted)}
.tile.sel{border-color:var(--brand);background:var(--brand-soft);box-shadow:0 0 0 3px rgba(25,88,86,.15)}
.tile.sel::after{content:'✓';position:absolute;top:-8px;right:-8px;width:22px;height:22px;border-radius:50%;background:var(--brand);color:#fff;font-size:13px;font-weight:700;display:flex;align-items:center;justify-content:center}
.tile.right{border-color:var(--ok);background:#eef7ea}
.tile.wrong{border-color:var(--bad);background:#fbeae4;animation:shake .4s}
.tile:disabled{cursor:default}
@keyframes shake{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
/* điền khuyết */
.blank{display:inline-block;min-width:92px;border-bottom:2px dashed var(--brand-light);padding:0 6px;margin:0 2px;text-align:center;color:var(--muted);font-weight:600}
.blank.cur{border-bottom-color:var(--gold);background:#fff6dd;border-radius:6px 6px 0 0}
.blank.filled{border-bottom:2px solid var(--brand);color:var(--red);font-weight:700}
.bank{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.wchip{border:1.5px solid var(--line);background:#fff;border-radius:99px;padding:7px 13px;font-size:15px;cursor:pointer;color:var(--brand-dark);font-weight:500}
.wchip:hover:not(:disabled){border-color:var(--brand-light);background:var(--stage-mid)}
.wchip.no{border-color:var(--bad);background:#fbeae4;animation:shake .4s}
.wchip:disabled{opacity:.35;cursor:default}
/* câu hỏi số trục */
.cntq{display:flex;align-items:center;justify-content:center;gap:12px;flex-wrap:wrap;margin-top:10px;padding:10px 12px;border-radius:var(--r-sm);background:#fff;border:1px solid var(--line)}
.cntq .lbl{flex:1 1 180px;font-size:15.5px;font-weight:600}
.cntq .nb{width:52px;height:52px;font-size:20px!important;border-radius:10px;border:1.5px solid var(--line);background:#fff;font-size:16px;font-weight:700;color:var(--brand-dark);cursor:pointer}
.cntq .nb.ok{background:var(--brand);border-color:var(--brand);color:#fff}
.cntq .nb.no{background:#fbeae4;border-color:var(--bad);color:#a54527;animation:shake .4s}
.cntq.done .lbl::after{content:' ✔';color:var(--ok)}
/* sắp xếp ví dụ */
.sortbox{display:flex;gap:8px;margin-top:10px}
.sortbox .qbtn{flex:1;margin:0}
.sortbox .qbtn.alt{background:#fff;color:var(--brand-dark);border:1.5px solid var(--brand)}
.prog{display:flex;gap:5px;margin:10px 0 0;flex-wrap:wrap}
.prog span{width:22px;height:8px;border-radius:99px;background:var(--line)}
.prog span.ok{background:var(--ok)} .prog span.no{background:var(--bad)} .prog span.cur{background:var(--gold)}
.myex{width:100%;margin-top:8px;padding:10px 12px;border-radius:var(--r-sm);border:1.5px solid var(--line);font:inherit;font-size:15.5px;resize:vertical;min-height:64px}
.myex:focus{outline:none;border-color:var(--brand-light)}
.sumgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.sumgrid div{background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px;text-align:center;font-size:14px;font-weight:600}
.sumgrid b{display:block;font-size:24px;color:var(--brand)}

/* thanh điều khiển 3D (dưới khung 3D) */
.dock{position:absolute;z-index:6;left:62px;right:calc(min(500px,44%) + 72px);bottom:12px;display:none;flex-wrap:wrap;justify-content:center;gap:6px;pointer-events:none}
.dock .grp{pointer-events:auto;display:flex;flex-wrap:wrap;align-items:center;gap:6px;background:rgba(255,255,255,.93);backdrop-filter:blur(10px);border-radius:14px;padding:6px 8px;box-shadow:var(--sh-3)}
.dock .gl{font-size:11.5px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);padding:0 4px}
.dk{border:1.5px solid var(--line);background:#fff;border-radius:10px;padding:7px 12px;font-size:13.5px;font-weight:600;color:var(--brand-dark);cursor:pointer;white-space:nowrap}
.dk:hover:not(:disabled){border-color:var(--brand-light);background:var(--stage-mid)}
.dk.on{background:var(--brand);border-color:var(--brand);color:#fff}
.dk.pri{background:var(--gold);border-color:#e9b93c;color:#4a3200}
.dk.pri:hover:not(:disabled){background:#ffd978}
.dk:disabled{opacity:.4;cursor:not-allowed}
.dk.found{border-color:var(--ok);color:#3f6b32;background:#eef7ea}
.dk.miss{border-color:var(--bad);color:#a54527;background:#fbeae4}
.dock input[type=range]{width:150px;accent-color:var(--brand)}
.dock .val{font-size:13px;font-weight:700;color:var(--brand-dark);min-width:38px}
.infobtn{position:relative;flex:0 0 auto;width:26px;height:26px;border-radius:50%;border:1.5px solid var(--brand-light);background:#fff;color:var(--brand);font:italic 700 14px Georgia,'Times New Roman',serif;display:flex;align-items:center;justify-content:center;cursor:help;outline:none}
.infobtn:hover,.infobtn:focus{background:var(--brand);color:#fff;border-color:var(--brand)}
.infobtn .tip{position:absolute;bottom:calc(100% + 12px);left:50%;transform:translateX(-50%) translateY(4px);width:min(300px,80vw);background:var(--brand-dark);color:#fff;font:400 13.5px/1.55 'Roboto',sans-serif;padding:10px 13px;border-radius:11px;box-shadow:var(--sh-3);opacity:0;visibility:hidden;transition:opacity .18s,transform .18s;pointer-events:none;text-align:left;z-index:10}
.infobtn .tip::after{content:'';position:absolute;top:100%;left:50%;margin-left:-7px;border:7px solid transparent;border-top-color:var(--brand-dark)}
.infobtn:hover .tip,.infobtn:focus .tip{opacity:1;visibility:visible;transform:translateX(-50%)}
.verdict{position:absolute;z-index:6;top:58px;left:calc((100% - min(500px,44%) - 60px)/2);transform:translateX(-50%);padding:8px 16px;border-radius:99px;font-size:15px;font-weight:700;box-shadow:var(--sh-3);white-space:normal;text-align:center;width:max-content;max-width:calc(100% - min(500px,44%) - 150px);display:none;animation:fade .3s ease}
.verdict.ok{display:block;background:#eef7ea;color:#2f5a24;border:2px solid var(--ok)}
.verdict.no{display:block;background:#fbeae4;color:#a54527;border:2px solid var(--bad)}
.verdict.info{display:block;background:#fff6dd;color:#6b4d13;border:2px solid var(--gold)}
.stage-hint{position:absolute;z-index:5;left:62px;bottom:72px;background:rgba(255,255,255,.88);border-radius:99px;padding:6px 12px;font-size:12.5px;font-weight:500;color:var(--brand-dark);box-shadow:var(--sh-1);transition:opacity .6s}
.stage-hint.hide{opacity:0;pointer-events:none}
.toast{position:absolute;left:50%;top:14px;transform:translate(-50%,-20px);z-index:40;background:var(--brand-dark);color:#fff;padding:9px 16px;border-radius:99px;font-size:14px;font-weight:600;opacity:0;pointer-events:none;transition:.3s;box-shadow:var(--sh-3);white-space:nowrap}
.toast.show{opacity:1;transform:translate(-50%,0)}
.loading{position:absolute;inset:0;z-index:8;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;background:linear-gradient(180deg,#fff,var(--stage-mid));text-align:center;padding:20px}
.loading p{margin:0;color:var(--muted);font-size:13px}
.spinner{width:34px;height:34px;border-radius:99px;border:3px solid var(--line);border-top-color:var(--brand);animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

.steps{display:flex;gap:8px;padding:10px 12px;overflow-x:auto;overflow-y:hidden;border-top:1px solid var(--line);scrollbar-width:none;flex:0 0 auto}
.steps::-webkit-scrollbar{display:none}
.step{flex:0 0 auto;display:flex;align-items:center;gap:7px;padding:7px 13px 7px 8px;border-radius:99px;border:1px solid var(--line);background:#fff;cursor:pointer;font-size:13px;font-weight:500;color:var(--ink);white-space:nowrap}
.step b{width:20px;height:20px;border-radius:99px;background:var(--brand-soft);color:var(--brand-dark);font-size:11px;display:flex;align-items:center;justify-content:center}
.step[aria-pressed="true"]{background:var(--brand);border-color:var(--brand);color:#fff;animation:stepJump .28s ease}
@keyframes stepJump{0%{transform:scale(.96)}70%{transform:scale(1.035)}100%{transform:scale(1)}}
.step[aria-pressed="true"] b{background:rgba(255,255,255,.25);color:#fff}
.step.done:not([aria-pressed="true"]) b{background:var(--brand);color:#fff}
.step.locked{opacity:.5;cursor:not-allowed}
.step.locked b{background:var(--line)}

.intro-loader{position:fixed;inset:0;z-index:10000;display:flex;align-items:center;justify-content:center;padding:24px;overflow:hidden;background:radial-gradient(80% 70% at 50% 40%,#2f827d 0,#195856 58%,#0b2a29 100%);transition:opacity .45s}
.intro-loader.gone{opacity:0;pointer-events:none}
.intro-inner{position:relative;z-index:2;width:min(760px,92vw);display:flex;flex-direction:column;align-items:center;text-align:center;color:#fff}
.intro-kicker{font-size:12px;font-weight:700;letter-spacing:.18em;text-transform:uppercase;color:#d6e78c}
.intro-inner h1{font-size:clamp(30px,4.6vw,50px);margin:10px 0 12px;line-height:1.14;font-weight:800;letter-spacing:-.02em;text-shadow:0 4px 18px rgba(0,0,0,.4)}
.intro-sub{max-width:680px;margin:0 auto 30px;font-size:14.5px;line-height:1.65;color:rgba(255,255,255,.93)}
.intro-progress{width:min(410px,72vw);height:3px;margin:0 auto 14px;border-radius:99px;background:rgba(255,255,255,.36);overflow:hidden}
.intro-progress span{display:block;height:100%;width:8%;background:#d8ff64;box-shadow:0 0 12px rgba(216,255,100,.5);transition:width .3s linear}
#introStatus{font-size:12px;font-weight:700;letter-spacing:.12em;text-transform:uppercase}
.ready-dot{width:8px;height:8px;border-radius:99px;background:#d8ff64;display:inline-block;margin-right:7px;box-shadow:0 0 10px rgba(216,255,100,.65)}
.intro-explore{margin:20px auto 0;min-width:210px;padding:12px 20px;border-radius:10px;border:1px solid rgba(255,255,255,.34);cursor:pointer;background:rgba(25,88,86,.82);color:#fff;font-weight:700;font-size:14px;opacity:0;transform:translateY(6px);pointer-events:none;transition:opacity .28s,transform .28s,background .2s}
.intro-loader.ready .intro-explore{opacity:1;transform:none;pointer-events:auto}
.intro-explore:hover{background:rgba(47,130,125,.96)}
.intro-credit{margin-top:30px;color:rgba(255,255,255,.86);font-size:12px}

@media (max-width:900px){
  .main{padding:10px}
  .titles h1{font-size:15px}
  .stage-nav{width:34px;height:34px;font-size:14px;top:25%}
  .view{right:0;bottom:calc(50% + 50px)}
  .lesson{left:8px;right:8px;top:auto;bottom:8px;width:auto;height:calc(50% - 8px)}
  .stage-tools{left:54px;top:8px}
  .ghost span{display:none}
  .dock{left:8px;right:8px;bottom:calc(50% + 4px);flex-wrap:nowrap;justify-content:flex-start;overflow-x:auto;scrollbar-width:none}
  .dock::-webkit-scrollbar{display:none}
  .dock{flex-wrap:wrap;justify-content:center;overflow:visible} /* cho khung ⓘ không bị cắt */
  .dock .grp{flex-wrap:wrap}
  .infobtn .tip{left:auto;right:-8px;transform:translateY(4px)}
  .infobtn:hover .tip,.infobtn:focus .tip{transform:none}
  .infobtn .tip::after{left:auto;right:14px}
  .dock .grp{flex:0 0 auto;flex-wrap:nowrap;padding:4px 6px;gap:4px;border-radius:12px}
  .dock .gl{display:none}
  .dk{padding:5px 9px;font-size:12px}
  .dock input[type=range]{width:100px}
  .verdict{left:50%;top:50px;font-size:13px;max-width:calc(100% - 100px)}
  .stage-hint{display:none}
  .sec h2{font-size:19px}
  .tiles{grid-template-columns:repeat(6,1fr);gap:6px}
  .tiles.gal{grid-template-columns:repeat(4,1fr)}
  .stage.full .lesson{left:8px;right:8px;top:8px;height:auto}
  .stage.full .tiles.gal{grid-template-columns:repeat(3,1fr);gap:8px;grid-template-rows:none}
  .stage.full .tile .iw{flex:none}
  .stage.full .tile .iw img{width:100%;height:auto}
  .stage.full .tile .cp{font-size:14px}
  .stage.full .sec>h2{font-size:20px}
  .stage.full .card p{font-size:16px}
}
/* trắc nghiệm toàn khung */
.stage.full #qz{flex:1;display:flex;flex-direction:column}
.stage.full #qz .card{flex:1;display:flex;flex-direction:column;justify-content:center;margin:10px 0 0;padding:28px 32px}
.stage.full #qz .card>p{font-size:32px;line-height:1.4}
.stage.full #qz .opts{gap:14px;margin-top:22px}
.stage.full #qz .opt{font-size:26px;padding:18px 22px;align-items:center}
.stage.full #qz .opt i{flex-basis:40px;height:40px;font-size:19px}
.stage.full #qz .fb{font-size:22px}
.stage.full .stage-nav{display:none}
.stage.full .lesson{left:16px;right:16px}
.stage.full #qz .next-btn{font-size:20px}
.stage.full #r5 .kcard p{font-size:26px}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}

<script type="module">
import * as THREE from 'three';
import {OrbitControls} from 'three/addons/controls/OrbitControls.js';

const $=(s,r=document)=>r.querySelector(s);
const $$=(s,r=document)=>[...r.querySelectorAll(s)];
const PI=Math.PI, DEG=PI/180;

/* =====================================================================
   1. Vẽ hình phẳng lên canvas (đơn vị: 1 đơn vị = K px, gốc ở giữa,
      trục y hướng XUỐNG giống canvas; mặt phẳng 3D rộng S đơn vị)
   ===================================================================== */
const S=3, N=1024, K=N/S;
function mk(draw){
  const c=document.createElement('canvas'); c.width=c.height=N;
  const g=c.getContext('2d'); g.setTransform(K,0,0,K,N/2,N/2);
  g.lineJoin='round'; g.lineCap='round'; draw(g); return c;
}
function line(g,pts,w,col){g.beginPath();pts.forEach((p,i)=>i?g.lineTo(p[0],p[1]):g.moveTo(p[0],p[1]));g.lineWidth=w;g.strokeStyle=col;g.stroke();}
function poly(g,pts,fill,stroke,w){g.beginPath();pts.forEach((p,i)=>i?g.lineTo(p[0],p[1]):g.moveTo(p[0],p[1]));g.closePath();if(fill){g.fillStyle=fill;g.fill();}if(stroke){g.lineWidth=w;g.strokeStyle=stroke;g.stroke();}}
function disk(g,x,y,r,fill,stroke,w){g.beginPath();g.arc(x,y,r,0,2*PI);if(fill){g.fillStyle=fill;g.fill();}if(stroke){g.lineWidth=w;g.strokeStyle=stroke;g.stroke();}}

/* ---- 5.1: hình thang cân ---- */
const cTrap=()=>mk(g=>poly(g,[[-0.55,-0.62],[0.55,-0.62],[1.1,0.62],[-1.1,0.62]],'#fff1a8','#b99a2e',0.035));
/* ---- 5.2: lục giác đều ---- */
const HEX_R=1.15;
const cHex=()=>mk(g=>poly(g,[0,1,2,3,4,5].map(i=>[HEX_R*Math.cos(i*PI/3),HEX_R*Math.sin(i*PI/3)]),'#3fd0ff','#1b86b0',0.035));
/* ---- 5.3: bốn hình ---- */
function star(g,cx,cy,R,r,fill){g.beginPath();for(let i=0;i<10;i++){const a=-PI/2+i*PI/5,q=i%2?r:R;g.lineTo(cx+q*Math.cos(a),cy+q*Math.sin(a));}g.closePath();g.fillStyle=fill;g.fill();}
const FIG53={
  a:{name:'Lá cờ',ax:[90],draw:g=>{g.fillStyle='#e8261f';g.fillRect(-1.3,-0.87,2.6,1.74);star(g,0,0.02,0.55,0.22,'#ffe600');}},
  b:{name:'Chữ P',ax:[],draw:g=>{g.beginPath();g.moveTo(-0.45,1.0);g.lineTo(-0.45,-0.9);g.lineTo(0.1,-0.9);g.arc(0.1,-0.4,0.5,-PI/2,PI/2);g.lineTo(-0.45,0.1);g.lineWidth=0.42;g.strokeStyle='#8a2a24';g.lineJoin='miter';g.lineCap='butt';g.stroke();}},
  c:{name:'Cỏ ba lá',ax:[90],draw:g=>{
    const col='#3fbf4f',cx=0,cy=-0.15;
    poly(g,[[-0.07,0],[0.07,0],[0.2,1.15],[-0.2,1.15]],col);
    [0,120,-120].forEach(d=>{g.save();g.translate(cx,cy);g.rotate(d*DEG);
      disk(g,-0.24,-0.56,0.3,col);disk(g,0.24,-0.56,0.3,col);poly(g,[[-0.5,-0.45],[0.5,-0.45],[0,0.05]],col);g.restore();});
    disk(g,cx,cy,0.2,col);}},
  d:{name:'Biển cấm',ax:[135,45],draw:g=>{disk(g,0,0,1.12,'#fff');disk(g,0,0,1.0,null,'#e8261f',0.22);line(g,[[-0.7,-0.7],[0.7,0.7]],0.22,'#e8261f');}},
};
/* ---- 5.4: bốn hình trên lưới ô vuông (1 ô = 0.25) ---- */
function arcMinor(g,cx,cy,r,p,q){const a=Math.atan2(p[1]-cy,p[0]-cx),b=Math.atan2(q[1]-cy,q[0]-cx);let d=b-a;while(d>PI)d-=2*PI;while(d<-PI)d+=2*PI;g.arc(cx,cy,r,a,b,d<0);}

function halfGeo(x0,x1){
  const {a,px,py}=F.axis, n=[Math.sin(a),-Math.cos(a)], u=[Math.cos(a),Math.sin(a)];
  const pts=[[x0,-R],[x1,-R],[x1,R],[x0,R]], pos=[], uv=[], nor=[];
  pts.forEach(([lx,ly])=>{
    pos.push(lx,ly,0);nor.push(0,0,1);
    const wx=px+lx*n[0]+ly*u[0], wy=py+lx*n[1]+ly*u[1];
    uv.push(wx/S+0.5,wy/S+0.5);
  });
  const g=new THREE.BufferGeometry();
  g.setAttribute('position',new THREE.Float32BufferAttribute(pos,3));
  g.setAttribute('normal',new THREE.Float32BufferAttribute(nor,3));
  g.setAttribute('uv',new THREE.Float32BufferAttribute(uv,2));
  g.setIndex([0,1,2,0,2,3]);return g;
}

/* ---- Kiểm tra hai nửa có chồng khít: so sánh từng điểm ảnh với điểm đối xứng ---- */
function matchScore(c,aDeg,px=0,py=0){
  const M=256, t=document.createElement('canvas');t.width=t.height=M;
  const g=t.getContext('2d',{willReadFrequently:true});g.drawImage(c,0,0,M,M);
  const d=g.getImageData(0,0,M,M).data, a=aDeg*DEG, n=[Math.sin(a),-Math.cos(a)];
  let tot=0,bad=0;
  for(let j=0;j<M;j++)for(let i=0;i<M;i++){
    const wx=(i+0.5)/M*S-S/2, wy=S/2-(j+0.5)/M*S;
    const dd=(wx-px)*n[0]+(wy-py)*n[1], rx=wx-2*dd*n[0], ry=wy-2*dd*n[1];
    const ii=Math.floor((rx+S/2)/S*M), jj=Math.floor((S/2-ry)/S*M);
    const k=(j*M+i)*4, A=d[k+3];
    const inside=ii>=0&&jj>=0&&ii<M&&jj<M, k2=(jj*M+ii)*4, B=inside?d[k2+3]:0;
    if(A<128&&B<128)continue; tot++;
    if((A>=128)!==(B>=128)){bad++;continue;}
    const cd=Math.abs(d[k]-d[k2])+Math.abs(d[k+1]-d[k2+1])+Math.abs(d[k+2]-d[k2+2]);
    if(cd>110)bad++;
  }
  return tot?1-bad/tot:1;
}

/* ---- Kéo trực tiếp trục d trên khung 3D (bước nào đặt axisDrag thì dùng được) ----
   Kéo thân trục: tịnh tiến song song; kéo gần đầu trục (chỗ nhãn d): xoay trục. */
let axisDrag=null, drag=null, interact=null, idrag=false;
const ray=new THREE.Raycaster(), zPlane=new THREE.Plane(new THREE.Vector3(0,0,1),0);
function planePoint(e){
  const r=renderer.domElement.getBoundingClientRect();
  ray.setFromCamera(new THREE.Vector2((e.clientX-r.left)/r.width*2-1,-(e.clientY-r.top)/r.height*2+1),camera);
  const p=new THREE.Vector3();return ray.ray.intersectPlane(zPlane,p)?p:null;
}
function axisHit(P){
  const {a,px,py}=F.axis,u=[Math.cos(a),Math.sin(a)],n=[Math.sin(a),-Math.cos(a)],dx=P.x-px,dy=P.y-py;
  const dist=Math.abs(dx*n[0]+dy*n[1]),along=dx*u[0]+dy*u[1];
  if(dist>0.22||Math.abs(along)>1.95)return null;
  return Math.abs(along)>0.95?'rot':'move';
}
const cvs=renderer.domElement;
cvs.addEventListener('pointerdown',e=>{
  if(interact&&!busy){const P=planePoint(e);if(P&&interact.down(P)){idrag=true;controls.enabled=false;cvs.setPointerCapture(e.pointerId);e.stopImmediatePropagation();e.preventDefault();}return;}
  if(!axisDrag||busy)return;const P=planePoint(e);if(!P)return;const mode=axisHit(P);if(!mode)return;
  drag={mode};controls.enabled=false;highlightAxis(true);cvs.setPointerCapture(e.pointerId);e.stopImmediatePropagation();e.preventDefault();
},{capture:true});
cvs.addEventListener('pointermove',e=>{
  if(interact){const P=planePoint(e);if(!P)return;if(idrag)interact.move(P);else view.style.cursor=busy?'':(interact.hover(P)||'');return;}
  if(!axisDrag)return;const P=planePoint(e);if(!P)return;
  if(!drag){const m=axisHit(P);view.style.cursor=m==='rot'?'crosshair':m==='move'?'move':'';highlightAxis(!!m&&!busy);return;}
  if(F.t>0){epoch++;busy=false;setT(0);verdict(null);}
  const {a,px,py}=F.axis;let ang=a/DEG,off;
  if(drag.mode==='rot'){
    ang=Math.atan2(P.y-py,P.x-px)/DEG;ang=Math.round(((ang%180)+180)%180/5)*5%180;
    const n=[Math.sin(ang*DEG),-Math.cos(ang*DEG)];off=px*n[0]+py*n[1];
  }else{
    const n=[Math.sin(a),-Math.cos(a)];off=P.x*n[0]+P.y*n[1];
  }
  if(Math.abs(off)<0.08)off=0; off=Math.max(-1,Math.min(1,off));
  axisDrag(ang,off);
},{capture:true});
const endDrag=()=>{if(drag){drag=null;controls.enabled=true;highlightAxis(false);}if(idrag){idrag=false;controls.enabled=true;interact?.up();}};
cvs.addEventListener('pointerleave',()=>{if(!drag)highlightAxis(false);});
cvs.addEventListener('pointerup',endDrag);cvs.addEventListener('pointercancel',endDrag);

/* ---- tween ---- */
let epoch=0;
const ease=k=>k<.5?2*k*k:1-Math.pow(-2*k+2,2)/2;
function tween(dur,fn){
  const e=epoch;return new Promise(res=>{const t0=performance.now();
    (function st(now){if(e!==epoch)return res(false);const k=Math.min(1,(now-t0)/dur);fn(ease(k));if(k<1)requestAnimationFrame(st);else res(true);})(t0);});
}
function foldTo(target,dur=1500){const a=F.t;if(Math.abs(target-a)>0.3&&!F.both)sfx('fold');return tween(dur*Math.max(.25,Math.abs(target-a)),k=>setT(a+(target-a)*k));}
function camTo(c,dur=1100){
  const p0=camera.position.clone(),t0=controls.target.clone(),p1=new THREE.Vector3(...c.p),t1=new THREE.Vector3(...c.t);
  return tween(dur,k=>{camera.position.lerpVectors(p0,p1,k);controls.target.lerpVectors(t0,t1,k);});
}

/* ---- hiệu ứng âm thanh (tạo bằng Web Audio, không cần file) ---- */
let AC=null;
function ac(){try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();if(AC.state==='suspended')AC.resume();}catch(e){}return AC;}
function tone(freq,t0,dur,{type='sine',vol=0.15,to=null}={}){
  const c=ac();if(!c)return;const o=c.createOscillator(),g=c.createGain(),t=c.currentTime+t0;
  o.type=type;o.frequency.setValueAtTime(freq,t);if(to)o.frequency.exponentialRampToValueAtTime(to,t+dur);
  g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(vol,t+0.015);g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
  o.connect(g).connect(c.destination);o.start(t);o.stop(t+dur+0.05);
}
function noise(t0,dur,{vol=0.12,freq=1200,q=0.8,type='bandpass',sweep=null}={}){
  const c=ac();if(!c)return;const n=Math.floor(c.sampleRate*dur),buf=c.createBuffer(1,n,c.sampleRate),d=buf.getChannelData(0);
  for(let i=0;i<n;i++)d[i]=Math.random()*2-1;
  const src=c.createBufferSource(),fl=c.createBiquadFilter(),g=c.createGain(),t=c.currentTime+t0;
  src.buffer=buf;fl.type=type;fl.Q.value=q;fl.frequency.setValueAtTime(freq,t);if(sweep)fl.frequency.exponentialRampToValueAtTime(sweep,t+dur);
  g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(vol,t+dur*0.3);g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
  src.connect(fl).connect(g).connect(c.destination);src.start(t);src.stop(t+dur+0.05);
}

  fold:()=>noise(0,0.45,{vol:0.10,freq:500,sweep:2400}),
  paper:()=>noise(0,0.25,{vol:0.08,freq:3000,q:0.5,type:'highpass'}),

  win:()=>[523,659,784,1047].forEach((f,i)=>tone(f,i*0.09,0.28,{type:'triangle',vol:0.11})),
};

async function foldCheck(okMsg='✔ Hai phần chồng khít – đây là trục đối xứng!',noMsg='✘ Hai phần KHÔNG chồng khít'){
  verdict(null);const e=epoch;const done=await foldTo(1);if(!done||e!==epoch)return null;
  const s=matchScore(F.canvas,F.axis.a/DEG,F.axis.px,F.axis.py);const ok=s>=0.98;
  verdict(ok?'ok':'no',ok?okMsg:noMsg);sfx(ok?'ok':'no');return ok;
}

// trục d kéo tự do
function freeAxis(a0=60,o0=0.35){
  const st={ang:a0,off:o0};
  const apply=()=>setAxis(st.ang,st.off*Math.sin(st.ang*DEG),-st.off*Math.cos(st.ang*DEG));
  axisDrag=(a,o)=>{st.ang=a;st.off=o;apply();};
  st.reset=()=>{st.ang=a0;st.off=o0;apply();};
  apply();showAxis(true);ghost(true);return st;
}
const tabImg=(draw,k,on,done,label)=>`<button class="subtab sg ${on?'on':''}" type="button" data-f="${k}" aria-label="${label}">${done?'<b>✓</b>':''}<img alt="" src="${figURL(draw)}"><span>${label}</span></button>`;

{label:'Trắc nghiệm',full:true,
 mount(p){
  const Q=[
   {q:'Đường thẳng d là trục đối xứng của một hình khi:',opts:['d chia hình thành hai phần bất kì','Gấp hình theo d thì hai phần chồng khít lên nhau','d đi qua một đỉnh của hình','d luôn là đường thẳng đứng'],ok:1,
    okMsg:'Gấp hình theo trục đối xứng thì hai phần của hình chồng khít lên nhau.'},
   {q:'Một hình có thể có bao nhiêu trục đối xứng?',opts:['Chỉ đúng một trục','Luôn có ít nhất một trục','Một, nhiều hoặc không có trục nào','Luôn có hai trục'],ok:2,
    okMsg:'Một hình có thể có một, nhiều (thậm chí vô số) hoặc không có trục đối xứng nào.'},
   {q:'Hai phần của hình nằm ở hai bên trục đối xứng thì:',opts:['Có hình dạng và kích thước giống nhau','Một phần lớn hơn phần kia','Có hình dạng khác nhau','Không có mối liên hệ gì'],ok:0,
    okMsg:'Hai phần đó giống hệt nhau nên khi gấp lại chúng chồng khít lên nhau.'},
   {q:'Phát biểu nào sau đây là <u>đúng</u>?',opts:['Mọi hình đều có trục đối xứng','Trục đối xứng luôn nằm ngang','Mọi đường thẳng chia hình thành hai phần đều là trục đối xứng','Có những hình không có trục đối xứng'],ok:3,
    okMsg:'Ví dụ: hình bình hành, chữ P, số 7 không có trục đối xứng.'},
   {q:'Để kiểm tra một đường thẳng có phải là trục đối xứng của hình hay không, ta có thể:',opts:['Đo chiều dài đường thẳng đó','Gấp hình theo đường thẳng đó và xem hai phần có chồng khít không','Tô màu hai phần của hình','Đếm số đỉnh của hình'],ok:1,
    okMsg:'Gấp hình theo đường thẳng đó: nếu hai phần chồng khít thì đó là trục đối xứng.'},
  ];

      <button class="qbtn" id="bAgain" type="button">↺ Làm lại</button></div>`;
    $('#bAgain').onclick=()=>{i=0;score=0;$('#r5').innerHTML='';$$('#prog span').forEach(s=>s.className='');show();};complete(4);};

 }},
];

function multiSelect({ans,fb,btn,hint,onOk,onPick}){
  const tiles=$$('#tiles .tile');let solved=false;
  tiles.forEach(t=>t.onclick=()=>{if(!solved){t.classList.toggle('sel');t.classList.remove('wrong','right');}onPick&&onPick(t.dataset.k);});
  btn.onclick=()=>{
    const chosen=tiles.filter(t=>t.classList.contains('sel')).map(t=>t.dataset.k);
    const miss=[...ans].filter(k=>!chosen.includes(k)),extra=chosen.filter(k=>!ans.has(k));
    if(!miss.length&&!extra.length){solved=true;tiles.forEach(t=>{if(!onPick)t.disabled=true;if(ans.has(t.dataset.k))t.classList.add('right');});btn.disabled=true;fb.className='fb show ok';sfx('ok');onOk();}
    else{tiles.forEach(t=>{if(extra.includes(t.dataset.k)){t.classList.remove('wrong');void t.offsetWidth;t.classList.add('wrong');}});fb.className='fb show no';fb.innerHTML='✘ Chưa đúng. '+hint(miss,extra);sfx('no');}
  };
}

/* =====================================================================
   5. Điều phối bước + khoá tiến độ
   ===================================================================== */
let cur=0;const finished=new Set(); // các bước đã làm xong (chỉ để hiện dấu ✓, không khoá bước)
function renderBar(){
  stepsBar.innerHTML=STEPS.map((s,i)=>`<button class="step ${finished.has(i)?'done':''}" type="button" data-i="${i}" aria-pressed="${i===cur}"><b>${finished.has(i)?'✓':i+1}</b><span>${s.label}</span></button>`).join('');
  $('#btnPrev').disabled=cur<=0;
  $('#btnNext').disabled=cur>=STEPS.length-1;
  $('#btnNext').classList.toggle('nudge',finished.has(cur)&&cur<STEPS.length-1);
  stepsBar.children[cur]?.scrollIntoView({block:'nearest',inline:'center',behavior:'smooth'});
}
stepsBar.onclick=e=>{const b=e.target.closest('.step');if(b)goTo(+b.dataset.i);};
$('#btnPrev').onclick=()=>goTo(cur-1);
$('#btnNext').onclick=()=>goTo(cur+1);
window.addEventListener('keydown',e=>{if(/INPUT|TEXTAREA/.test(e.target.tagName))return;if(e.key==='ArrowRight')goTo(cur+1);else if(e.key==='ArrowLeft')goTo(cur-1);});

function complete(i){
  if(!finished.has(i))setTimeout(()=>sfx('win'),350);
  finished.add(i);
  renderBar();
  if(i===cur&&i<STEPS.length-1&&!$('.next-wrap.go')){
    const w=document.createElement('div');w.className='next-wrap go';
    w.innerHTML=`<button class="qbtn next-btn" type="button">Tiếp tục: ${STEPS[i+1].label} ▶</button>`;
    w.firstChild.onclick=()=>goTo(i+1);
    $('.sec',sidebody).appendChild(w);
    setTimeout(()=>w.scrollIntoView({behavior:'smooth',block:'nearest'}),150);
  }
}
function resetScene(){ // đặt lại cảnh 3D
  epoch++;busy=false;axisDrag=null;drag=null;interact=null;idrag=false;controls.enabled=true;view.style.cursor='';highlightAxis(false);
  flap=false;F.both=false;grid.visible=false;clearMarks();ghost(false);setT(0);verdict(null);dock('');
  camTo(CAM0,700);
}
function goTo(n){
  n=Math.max(0,Math.min(STEPS.length-1,n));
  cur=n;resetScene();$('#stage').classList.toggle('full',!!STEPS[n].full);
  controls.autoRotate=false;
  sidebody.innerHTML='<div class="sec"></div>';sidebody.scrollTop=0;
  STEPS[n].mount($('.sec',sidebody));
  renderBar();
  if(finished.has(n))complete(n);

}

/* =====================================================================
   6. Màn hình mở đầu
   ===================================================================== */
$('#loadingEl').style.display='none';resize();goTo(0);
setTimeout(()=>$('#stageHint').classList.add('hide'),5000);
// cho phép mở thẳng một bước khi xem thử: ?step=5
const qs=new URLSearchParams(location.search);

window.__lesson={goTo,STEPS,matchScore,F};
